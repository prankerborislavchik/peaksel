services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # порт внутри контейнера:порт самого контейнера
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - SECRET_KEY=${SECRET_KEY}
      - SETUP_KEY=${SETUP_KEY}
      - EMAIL=${EMAIL}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-peaksel_bd}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - app-network
    volumes:
      - ./uploads:/app/public/uploads  # bind том для загрузок файлов
      - ./logs:/app/logs              # bind том для логов
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  postgres:
    image: postgres:17-alpine
    restart: always
    ports:
      - "5432:5432" # если нужно подключаться извне
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - pg_data:/var/lib/postgresql/data # именованный том
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # bind том
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

networks:
  app-network:
    driver: bridge

volumes:
  pg_data: # именованный том для данных БД